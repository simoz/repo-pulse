name: Collect traffic
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: traffic
  cancel-in-progress: false
jobs:
  collect:
    # Forks have no TRAFFIC_TOKEN; never run there.
    if: github.repository == 'simoz/repo-pulse'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out private data repository
        uses: actions/checkout@v4
        with:
          repository: simoz/repo-pulse-data
          token: ${{ secrets.TRAFFIC_TOKEN }}
          path: pulse-data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect traffic
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          STATS_OWNER: simoz
          DATA_DIR: pulse-data
        run: python3 collect.py
      - name: Save observations
        if: always()
        working-directory: pulse-data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data index.html
          if ! git diff --cached --quiet; then
            git commit -q -m 'Update traffic observations'
            git push -q
          fi
